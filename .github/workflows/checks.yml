name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run openwrt:core -- --check

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Scan Git history
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner

  network-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.10'
          cache: false
      - name: Prepare pinned upstream sources
        shell: bash
        run: |
          set -euo pipefail
          git init --quiet "$RUNNER_TEMP/core-box"
          git -C "$RUNNER_TEMP/core-box" fetch --depth 1 https://github.com/SagerNet/sing-box 628cb31ffa79cffffd34c2f9cde6cae044e4fc12
          git -C "$RUNNER_TEMP/core-box" checkout --detach FETCH_HEAD
          git init --quiet "$RUNNER_TEMP/core-tun"
          git -C "$RUNNER_TEMP/core-tun" fetch --depth 1 https://github.com/SagerNet/sing-tun f3b42b8b8e061ef849213a776d9fcf3d5f6ea239
          git -C "$RUNNER_TEMP/core-tun" checkout --detach FETCH_HEAD
          git init --quiet "$RUNNER_TEMP/core-sing"
          git -C "$RUNNER_TEMP/core-sing" fetch --depth 1 https://github.com/SagerNet/sing 87773cc9c5b2a4e4fc05cbd2db304ba23ca13515
          git -C "$RUNNER_TEMP/core-sing" checkout --detach FETCH_HEAD
          python3 scripts/prepare-network-core.py --sing-box "$RUNNER_TEMP/core-box" --sing-tun "$RUNNER_TEMP/core-tun" --sing "$RUNNER_TEMP/core-sing" --output "$RUNNER_TEMP/patched"
      - name: Test DNS concurrency and ICMP classification
        shell: bash
        env:
          GOTOOLCHAIN: local
        run: |
          set -euo pipefail
          (cd "$RUNNER_TEMP/patched/source" && go test -mod=readonly -race ./dns/transport -run TestObhod -count=1)
          (cd "$RUNNER_TEMP/patched/source" && go test -mod=readonly -race ./route -run TestObhod -count=1)
          (cd "$RUNNER_TEMP/patched/sing" && go test -mod=readonly -race ./common/udpnat2 -run TestObhod -count=1)
          (cd "$RUNNER_TEMP/patched/sing-tun" && go test -mod=readonly -race ./ping -run TestObhod -count=1)
          sh core/build.sh "$RUNNER_TEMP/patched" "$RUNNER_TEMP/binaries" amd64 lite
          "$RUNNER_TEMP/binaries/sing-box-linux-amd64-lite" obhod-capabilities | grep -qx dns-pool-v1
